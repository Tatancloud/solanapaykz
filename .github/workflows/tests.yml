# Тесты гоняются на каждый коммит и каждое предложение изменений.
# Проект принимает деньги, поэтому красный прогон здесь — повод остановиться,
# а не «посмотреть потом».
name: Тесты

on:
  push:
    branches: [main]
  pull_request:

jobs:
  sdk:
    name: Библиотека @solanapaykz/core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # --include=dev обязателен: в окружениях с NODE_ENV=production npm
      # молча пропускает зависимости разработки, и тесты просто не запустятся.
      #
      # npm ci, а не npm install: ci отказывается, если package.json и
      # package-lock.json разошлись (install в этом случае молча ставит
      # версию из package.json и переписывает замок) — ровно то расхождение,
      # из-за которого прошлая поломка сборки проехала мимо этих проверок
      # незамеченной (см. Dockerfile, тот же аргумент).
      - run: npm ci --include=dev
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  tilda-server:
    name: Сервер для Tilda
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # npm ci — та же причина, что и в задании sdk выше.
      - run: npm ci --include=dev
      - run: npm run build
      - name: Зависимости сервера
        working-directory: tilda-server
        run: npm ci --include=dev
      - name: Тесты сервера
        working-directory: tilda-server
        run: npm test

  docker-image:
    name: Образ сервера — сборка и запуск
    runs-on: ubuntu-latest
    # Находка ревью: прошлая поломка сборки образа прошла все остальные
    # задания зелёными — ни одно из них не собирает Dockerfile вообще, только
    # npm-пакеты напрямую на раннере. Это задание закрывает ровно ту дыру:
    # собирает именно tilda-server/Dockerfile (тот же контекст сборки —
    # корень репозитория, что и в docker-compose.yml) и запускает контейнер
    # из получившегося образа. Одной успешной сборки недостаточно — сборка
    # уже проходила зелёной в тот раз, когда сервер не отвечал: настоящая
    # проверка — что процесс внутри контейнера действительно поднимается и
    # отвечает на HTTP.
    steps:
      - uses: actions/checkout@v4
      - name: Собрать образ
        run: docker build -f tilda-server/Dockerfile -t solanapaykz-tilda-server:ci .
      - name: Запустить контейнер
        # Настройки — tilda-server/config.ci.json, без единого настоящего
        # секрета (см. комментарий в самом файле): цель — поднять процесс и
        # получить ответ на HTTP, а не провести настоящий платёж.
        run: |
          docker run -d --name tilda-ci -p 18080:8080 \
            -v "$PWD/tilda-server/config.ci.json:/app/tilda-server/config.json:ro" \
            solanapaykz-tilda-server:ci
      - name: Подождать готовности
        run: |
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:18080/; then
              echo "готов после ${i} попыток"
              exit 0
            fi
            sleep 1
          done
          echo "сервер не ответил за 30 секунд" >&2
          docker logs tilda-ci
          exit 1
      - name: Smoke — корневая страница отвечает 200
        run: |
          код=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/)
          if [ "$код" != "200" ]; then
            echo "GET / вернул $код, а не 200" >&2
            docker logs tilda-ci
            exit 1
          fi
      - name: Smoke — вход без подписи отвечает 400
        # Дефект, воспроизведённый ревью в другом месте того же сервера
        # (routes-pay.ts): непроверенный вход без подписи не должен приниматься
        # ни от собранного вручную процесса, ни от процесса из этого образа.
        run: |
          код=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:18080/tilda/pay -d 'order_id=1')
          if [ "$код" != "400" ]; then
            echo "POST /tilda/pay без подписи вернул $код, а не 400" >&2
            docker logs tilda-ci
            exit 1
          fi
      - name: Логи контейнера
        if: always()
        run: docker logs tilda-ci || true
      - name: Убрать контейнер и образ
        if: always()
        run: |
          docker rm -f tilda-ci || true
          docker rmi solanapaykz-tilda-server:ci || true

  plugin:
    name: Плагин WooCommerce — тесты
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          # Тесты гоняются на 8.3, а не на заявленном минимуме 8.1: PHPUnit 11
          # требует PHP 8.2 и выше. Сам плагин на 8.1 работает — это проверяет
          # отдельное задание ниже, иначе обещание про 8.1 было бы словом без
          # подтверждения.
          php-version: '8.3'
          # bcmath обязателен: без него расчёт суммы теряет точность на
          # заказах дороже 92 233,72 ₸ — см. документацию.
          extensions: bcmath, curl, json
      - name: Зависимости плагина
        working-directory: demo-shop/plugin
        run: composer install --no-interaction --no-progress
      - name: Тесты плагина
        working-directory: demo-shop/plugin
        run: vendor/bin/phpunit

  plugin-php81:
    name: Плагин WooCommerce — минимальный PHP 8.1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: bcmath, curl, json
      - name: Зависимости боевой поставки
        working-directory: demo-shop/plugin
        # Только то, что уезжает к продавцу: средства разработки требуют 8.2+
        # и в поставку не входят.
        run: composer install --no-interaction --no-progress --no-dev
      - name: Разбор всех файлов плагина
        working-directory: demo-shop/plugin
        # Проверка синтаксиса, а не поведения: доказывает, что на 8.1 плагин
        # хотя бы загрузится. Поведение проверяют тесты на 8.3.
        run: find . -path ./vendor -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l
