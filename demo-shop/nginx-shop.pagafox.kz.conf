# Демо-магазин SolanaPay-KZ. Ставится в /etc/nginx/sites-available/
# и включается симлинком в sites-enabled после появления A-записи.
# Сертификат выпускается certbot'ом, он же допишет сюда блок ssl_*.

server {
    listen 80;
    listen [::]:80;
    server_name shop.pagafox.kz;

    # Загрузка товаров и плагинов из админки WordPress.
    client_max_body_size 64M;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Без этого заголовка WordPress за прокси строит ссылки на http
        # и роняет админку в бесконечный редирект.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
