# Сервер приёма оплаты для Tilda — pay.kabyldau.digital.
#
# Ставится в /etc/nginx/sites-available/pay.kabyldau.digital и включается
# симлинком в sites-enabled. Блок ssl_* и второй server{} (редирект с 80 на
# 443) дописывает certbot — команда из README.md:
#   sudo certbot --nginx -d pay.kabyldau.digital
#
# 8081, а не 8080 — на этом хосте 8080 уже занят демо-магазином (WordPress,
# см. ../demo-shop/nginx-shop.pagafox.kz.conf); tilda-server слушает свой
# порт (config.json → listenPort), опубликованный docker-compose.yml на
# 127.0.0.1 хоста (обычная сеть моста Docker, не network_mode: host — см.
# заголовок docker-compose.yml).

server {
    listen 80;
    listen [::]:80;
    server_name pay.kabyldau.digital;

    # HSTS сюда специально НЕ добавлен как `add_header` nginx. Раньше здесь
    # стояла именно такая строка с комментарием, что «ни nginx, ни сам
    # сервер его не отдают» — находка ревью (задача 9, текущий круг): это
    # уже неверно. Сервер отдаёт этот заголовок сам (см.
    # `ЗАГОЛОВКИ_БЕЗОПАСНОСТИ` в `src/http/server.ts`), вместе с CSP и
    # `X-Frame-Options` — а те в этом файле НИКОГДА не дублировались.
    # Держать `Strict-Transport-Security` ещё и здесь означало бы два места
    # с одним и тем же значением (`max-age`), которые пришлось бы вручную
    # держать синхронными и которые могут разойтись при следующей правке
    # одного без другого — источник должен быть один, и это приложение, а
    # не nginx.

    # Тело запроса от Tilda — подписанная форма заказа (список товаров
    # входит в неё же) либо вебхук формы (задача 9). 64 КБ — с запасом выше
    # любого разумного состава корзины и заметно меньше, чем нужно, чтобы
    # положить процесс десятками мегабайт чужого тела (сервер и сам
    # ограничивает тело запроса, см. src/http/routes-pay.ts, но обрубить
    # заведомо большое тело на границе nginx дешевле, чем тратить на него
    # соединение и время самого процесса Node).
    client_max_body_size 64k;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;

        # X-Real-IP сюда намеренно НЕ входит: счётчик попыток входа в
        # /admin (src/http/routes-admin.ts) читает исходный адрес клиента
        # из X-Forwarded-For — но не самый левый элемент цепочки, а самый
        # ПРАВЫЙ: $proxy_add_x_forwarded_for СОХРАНЯЕТ то, что прислал
        # клиент, и ДОПИСЫВАЕТ настоящий адрес соединения справа (правка
        # финального ревью — левый элемент подделывается клиентом тривиально,
        # правый — нет, его подставляет сам nginx). См. комментарий у
        # клиентскийАдрес() в routes-admin.ts.
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Сервер сам решает, когда отвечать (быстро — на test=test вебхука,
        # дольше — пока ждёт котировку или платёжный запрос от SDK);
        # 30 секунд с запасом выше любого из этих случаев в обычной работе.
        proxy_read_timeout 30s;
    }
}
