# Сервер приёма оплаты для Tilda — рядом с уже работающим демо-магазином
# (../demo-shop/docker-compose.yml), как отдельный, независимый стек:
# у него нет ни общей сети, ни общих томов с WordPress/MariaDB демо-магазина,
# и поднятие или перезапуск одного не должно задевать другой.
#
# network_mode: host, а не обычный проброс портов (`ports:`) — единственная
# причина в том, как устроен счётчик попыток входа в /admin (см. заголовок
# src/http/routes-admin.ts): он доверяет заголовку X-Forwarded-For ТОЛЬКО
# когда TCP-соединение пришло буквально с адреса 127.0.0.1. При обычном
# мостовом режиме Docker запрос от nginx (он снаружи контейнера, на хосте)
# доходит до процесса через NAT моста и виден с адреса шлюза Docker, а не
# с 127.0.0.1 — доверенным адресом это не считается, и вся защита от
# перебора пароля откатывается на общий счётчик на всех сразу. Host-режим
# делает порт контейнера тем же сокетом, что и на хосте, — nginx и node
# видят друг друга как два процесса на одной машине, ровно как если бы
# node работал без Docker вовсе.
#
# Оборотная сторона: слушающий порт — тот же listenPort из config.json,
# и он общий на весь хост, а не только на этот контейнер. 8080 уже занят
# демо-магазином (127.0.0.1:8080 — WordPress), поэтому в config.json этого
# сервера должен стоять другой порт (см. config.example.json — по умолчанию
# 8080, здесь — 8081, см. README.md).

services:
  tilda-server:
    build:
      context: ..
      dockerfile: tilda-server/Dockerfile
    container_name: solanapaykz_tilda_server
    restart: unless-stopped
    network_mode: host
    volumes:
      # Настройки — файл, а не переменные окружения (в них проще случайно
      # насветить секрет через `docker inspect`/`ps aux` у соседнего
      # процесса на этом же хосте). Только на чтение — процесс не должен
      # суметь переписать собственные настройки, даже если где-то в коде
      # найдётся для этого лазейка. Права 600 стоят на файле НА ХОСТЕ
      # (см. README.md, шаг развёртывания) — :ro в Docker ограничивает
      # только сам контейнер, а не то, кто может прочитать файл на хосте.
      - ./config.json:/app/tilda-server/config.json:ro
      # Файл SQLite с заказами — переживает пересборку и перезапуск
      # контейнера. Именованный том, а не bind-mount: право владения
      # файлом внутри тома не зависит от uid хоста и образа.
      - tilda_data:/app/tilda-server/data

volumes:
  tilda_data:
