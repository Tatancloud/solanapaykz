# Сервер приёма оплаты для Tilda — рядом с уже работающим демо-магазином
# (../demo-shop/docker-compose.yml), как отдельный, независимый стек:
# у него нет ни общей сети, ни общих томов с WordPress/MariaDB демо-магазина,
# и поднятие или перезапуск одного не должно задевать другой.
#
# Обычная (не host) сеть Docker со своей подсетью — правка ревью задачи 9.
# Первая версия использовала network_mode: host, потому что счётчик попыток
# входа в /admin (см. заголовок src/http/routes-admin.ts) доверяет
# X-Forwarded-For только с loopback, а обычный мост Docker подменяет
# видимый адрес клиента на адрес своего шлюза. Это лечило симптом ценой
# всего хостового сетевого пространства ради одного контейнера. Настоящая
# причина — то, что доверенный адрес был жёстко зашит, а не настройкой —
# устранена: теперь список доверенных адресов (config.json →
# trustedProxyAddresses) включает адрес шлюза ЭТОЙ подсети, а порт
# по-прежнему публикуется наружу только на 127.0.0.1 хоста — ровно тот же
# уровень изоляции, что и раньше, без host-режима.
#
# Подсеть 172.21.0.0/24 выбрана свободной: на этом хосте заняты 172.17-172.20
# (проверено `docker network ls` + `docker network inspect` на момент
# развёртывания — demo-shop, bko, astana, встроенный bridge). Шлюз подсети —
# первый адрес, 172.21.0.1 — именно он должен стоять в
# config.json → trustedProxyAddresses (см. README.md, «Развёртывание»).

services:
  tilda-server:
    build:
      context: ..
      dockerfile: tilda-server/Dockerfile
    container_name: solanapaykz_tilda_server
    restart: unless-stopped
    networks:
      - tilda_net
    ports:
      # Порт совпадает с config.json → listenPort. Публикуется ТОЛЬКО на
      # loopback хоста — снаружи доступ идёт через nginx (nginx.example.conf).
      - "127.0.0.1:8081:8081"
    volumes:
      # Настройки — файл, а не переменные окружения (в них проще случайно
      # насветить секрет через `docker inspect`/`ps aux` у соседнего
      # процесса на этом же хосте). Только на чтение — процесс не должен
      # суметь переписать собственные настройки, даже если где-то в коде
      # найдётся для этого лазейка. Права 600 стоят на файле НА ХОСТЕ
      # (см. README.md, шаг развёртывания) — :ro в Docker ограничивает
      # только сам контейнер, а не то, кто может прочитать файл на хосте.
      - ./config.json:/app/tilda-server/config.json:ro
      # Файл SQLite с заказами — переживает пересборку и перезапуск
      # контейнера. Именованный том, а не bind-mount: право владения
      # файлом внутри тома не зависит от uid хоста и образа.
      - tilda_data:/app/tilda-server/data

networks:
  tilda_net:
    ipam:
      config:
        - subnet: 172.21.0.0/24

volumes:
  tilda_data:
